services:
  nemera-api:
    container_name: nemera-api
    build:
      context: .
      dockerfile: Nemera.Presentation.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5214
      - ASPNETCORE_HTTPS_PORTS=7057
    ports:
      - "5214:5214"
      - "7057:7057"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    command: "dotnet /app/Nemera.Presentation.Api.dll"
  nemera-web:
    container_name: nemera-web
    build:
      context: .
      dockerfile: Nemera.Presentation.Web/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5012
      - ASPNETCORE_HTTPS_PORTS=7112
    ports:
      - "5012:5012"
      - "7112:7112"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    command: "dotnet /app/Nemera.Presentation.Web.dll"
