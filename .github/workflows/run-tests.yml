name: Run All Tests

on:
  pull_request:
    branches:
      - master
  workflow_dispatch: # enable manual triggers

jobs:
  run-platform-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v2
      - name: Set up .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '10.0.x'
      - name: Restore Six Labors license
        shell: bash
        run: printf '%s\n' "${{ secrets.SIXLABORS_LICENSE_KEY }}" > src/Lumina.Domain/sixlabors.lic
      - name: Restore dependencies
        run: dotnet restore src/Lumina.sln
      - name: Build
        run: dotnet build src/Lumina.sln --no-restore -p:SixLaborsLicenseEnforceBuild=true
      - name: Run tests
        run: dotnet test src/Lumina.sln --no-build --verbosity normal
